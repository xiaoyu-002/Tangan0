<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI Copilot product preview</title>
  <desc id="desc">A glassmorphism data workspace with an AI recommendation panel, signal cards, charts, and campaign tasks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EFF4FF"/>
      <stop offset="0.48" stop-color="#F5ECFF"/>
      <stop offset="1" stop-color="#F0FFE3"/>
    </linearGradient>
    <linearGradient id="panel" x1="284" y1="60" x2="898" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.56"/>
    </linearGradient>
    <linearGradient id="darkPanel" x1="64" y1="44" x2="248" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151921"/>
      <stop offset="1" stop-color="#232A36"/>
    </linearGradient>
    <linearGradient id="bluePurple" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6082F7"/>
      <stop offset="1" stop-color="#E2BBFF"/>
    </linearGradient>
    <linearGradient id="greenBlue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#DBFFBA"/>
      <stop offset="1" stop-color="#BFD2FF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#151921" flood-opacity="0.14"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

